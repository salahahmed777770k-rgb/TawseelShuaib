Name: Build Tawseel Shuaib APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - رئيسي

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd برنامج
          chmod +x gradlew || true
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TawseelShuaib-APK
          path: برنامج/build/outputs/apk/debug/*.apk
